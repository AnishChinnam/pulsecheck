services:
  - type: web
    name: pulsecheck-anish
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.lock && pip install -e . --no-deps
    startCommand: python -m pulsecheck.deploy
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: PULSECHECK_DB
        value: /tmp/pulsecheck-demo.db
